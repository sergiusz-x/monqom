services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - monqom-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - monqom-backend-node_modules:/app/node_modules
      - monqom-backend-package-node_modules:/app/backend/node_modules
      - monqom-ui-node_modules:/app/packages/ui/node_modules
    command: sh -c "CI=true pnpm install --frozen-lockfile && pnpm --dir backend exec prisma generate && pnpm --dir backend run migrate:deploy && pnpm --dir backend run start:dev"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_TARGET: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - monqom-frontend-node_modules:/app/node_modules
      - monqom-frontend-package-node_modules:/app/frontend/node_modules
      - monqom-ui-node_modules:/app/packages/ui/node_modules
    command: sh -c "CI=true pnpm install --frozen-lockfile && pnpm --dir frontend exec vite --host 0.0.0.0"

volumes:
  monqom-pgdata:
  monqom-backend-node_modules:
  monqom-frontend-node_modules:
  monqom-backend-package-node_modules:
  monqom-frontend-package-node_modules:
  monqom-ui-node_modules:
