name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monqom
          POSTGRES_PASSWORD: monqom
          POSTGRES_DB: monqom_ci
        ports: ["5432:5432"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://monqom:monqom@127.0.0.1:5432/monqom_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma validate
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run openapi:generate
      - name: Cache pinned OpenAPI Generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator/5.4.0.jar
          key: openapi-generator-5.4.0-${{ runner.os }}
      - name: Provision verified OpenAPI Generator
        working-directory: .
        run: |
          mkdir -p .cache/openapi-generator
          artifact=.cache/openapi-generator/5.4.0.jar
          checksum='f3ed312310e390324b33ba2ffff290ce812935207a1493ec5c098d0a441be51c'
          if ! echo "$checksum  $artifact" | sha256sum --check --status; then
            rm -f "$artifact"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              https://repo.maven.apache.org/maven2/org/openapitools/openapi-generator-cli/5.4.0/openapi-generator-cli-5.4.0.jar \
              --output "$artifact"
          fi
          echo "$checksum  $artifact" | sha256sum --check
      - run: pnpm run client:generate
      - run: git diff --exit-code || (echo "Contract drift detected" && exit 1)
      - run: test -z "$(git status --porcelain)" || (echo "Contract drift detected in untracked files" && exit 1)
      - run: pnpm test -- --runInBand
      - run: pnpm run migrate:deploy
      - run: pnpm run test:e2e:critical -- --runInBand
      - run: pnpm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:e2e
      - run: pnpm audit --prod --audit-level=high
        working-directory: .
      - run: pnpm audit --audit-level=high
        working-directory: .
  production-containers:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monqom
          POSTGRES_PASSWORD: monqom
          POSTGRES_DB: monqom_container_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monqom -d monqom_container_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dokploy Compose
        env:
          DATABASE_URL: postgresql://monqom:monqom@database:5432/monqom
          SESSION_SECRET: 01234567890123456789012345678901
          TOTP_ENCRYPTION_KEY: 01234567890123456789012345678901
          FRONTEND_URL: https://app.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          RESEND_API_KEY: re_test_placeholder
          EMAIL_FROM: Monqom <noreply@example.test>
          EMAIL_OUTBOX_ENCRYPTION_KEY: 01234567890123456789012345678901
          TRUST_PROXY_HOPS: "1"
          TURNSTILE_ENABLED: "true"
          TURNSTILE_SECRET_KEY: turnstile_test_placeholder
          VITE_TURNSTILE_SITE_KEY: turnstile_site_test_placeholder
          MIGRATION_IMAGE: ghcr.io/sergiusz-x/monqom-migration@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BACKEND_IMAGE: ghcr.io/sergiusz-x/monqom-backend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          FRONTEND_IMAGE: ghcr.io/sergiusz-x/monqom-frontend@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          docker compose -f docker-compose.dokploy.yml config --quiet
          docker compose -f docker-compose.dokploy.yml config --format json | jq -e '.services | all(.networks | has("dokploy-network"))'
          docker compose -f docker-compose.immutable.yml config --quiet
          docker compose -f docker-compose.immutable.yml config --format json | jq -e '
            .services
            | all(has("build") | not)
            and all(.image | test("^ghcr\\.io/.+@sha256:[a-f0-9]{64}$"))
          '
      - run: node scripts/deploy-dokploy.test.mjs
      - run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} --target migration --tag monqom-backend-migration:ci --file backend/Dockerfile .
      - run: docker run --rm --entrypoint sh monqom-backend-migration:ci -c 'test -f /app/backend/prisma.config.ts && test ! -e /usr/local/bin/npm && node ./node_modules/prisma/build/index.js --version'
      - name: Scan migration image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: monqom-backend-migration:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} --target runtime --tag monqom-backend:ci --file backend/Dockerfile .
      - run: docker run --rm --entrypoint sh monqom-backend:ci -c 'test -f /app/backend/dist/main.js && test ! -e /usr/local/bin/npm && test ! -e /app/backend/node_modules/.bin/jest && grep -q "APP_VERSION=.ci." /app/backend/release.env && grep -q "GIT_SHA=.${{ github.sha }}." /app/backend/release.env'
      - run: docker run --rm --entrypoint node monqom-backend:ci -e "require.resolve('@nestjs/swagger')"
      - run: docker run --rm --entrypoint node monqom-backend:ci -e "require('@prisma/client')"
      - name: Start exact production backend image
        run: |
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://monqom:monqom@127.0.0.1:5432/monqom_container_ci \
            monqom-backend-migration:ci
          docker run --detach --name monqom-backend-ci --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://monqom:monqom@127.0.0.1:5432/monqom_container_ci \
            -e SESSION_SECRET=01234567890123456789012345678901 \
            -e TOTP_ENCRYPTION_KEY=01234567890123456789012345678901 \
            -e FRONTEND_URL=https://app.example.test \
            -e CORS_ALLOWED_ORIGINS=https://app.example.test \
            -e RESEND_API_KEY=re_test_placeholder \
            -e EMAIL_FROM=noreply@example.test \
            -e EMAIL_OUTBOX_ENCRYPTION_KEY=01234567890123456789012345678901 \
            -e TURNSTILE_ENABLED=false \
            -e TRUST_PROXY_HOPS=1 \
            monqom-backend:ci
          trap 'docker rm -f monqom-backend-ci >/dev/null' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs monqom-backend-ci
          exit 1
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: monqom-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} --tag monqom-frontend:ci --file frontend/Dockerfile .
      - run: docker run --rm --add-host backend:127.0.0.1 monqom-frontend:ci nginx -t
      - run: docker run --rm --entrypoint sh monqom-frontend:ci -c 'grep -q "script-src .self. https://challenges.cloudflare.com" /etc/nginx/conf.d/default.conf && grep -q "frame-src https://challenges.cloudflare.com" /etc/nginx/conf.d/default.conf && grep -q "X-Forwarded-Proto .client_forwarded_proto" /etc/nginx/conf.d/default.conf && test -f /usr/share/nginx/html/theme-init.js && ! grep -q "<script>" /usr/share/nginx/html/index.html'
      - run: docker run --rm --entrypoint sh monqom-frontend:ci -c 'grep -q "\"version\":\"ci\"" /usr/share/nginx/html/version.json && grep -q "\"sha\":\"${{ github.sha }}\"" /usr/share/nginx/html/version.json'
      - name: Verify automatic PWA activation
        run: docker run --rm --entrypoint sh monqom-frontend:ci -c 'grep -q "skipWaiting()" /usr/share/nginx/html/sw.js && grep -q "clientsClaim()" /usr/share/nginx/html/sw.js'
      - name: Exercise critical journey through exact production images
        env:
          MIGRATION_IMAGE: monqom-backend-migration:ci
          BACKEND_IMAGE: monqom-backend:ci
          FRONTEND_IMAGE: monqom-frontend:ci
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: sh scripts/verify-production-images.sh
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: monqom-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
