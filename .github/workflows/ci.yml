name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monqom
          POSTGRES_PASSWORD: monqom
          POSTGRES_DB: monqom_ci
        ports: ["5432:5432"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://monqom:monqom@127.0.0.1:5432/monqom_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: npx prisma generate
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test -- --runInBand
      - run: pnpm run migrate:deploy
      - run: pnpm run test:e2e:critical -- --runInBand
      - run: pnpm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm audit --audit-level=high
        working-directory: .
  production-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dokploy Compose
        env:
          DATABASE_URL: postgresql://monqom:monqom@database:5432/monqom
          SESSION_SECRET: 01234567890123456789012345678901
          TOTP_ENCRYPTION_KEY: 01234567890123456789012345678901
          FRONTEND_URL: https://app.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          RESEND_API_KEY: re_test_placeholder
          EMAIL_FROM: Monqom <noreply@example.test>
          TURNSTILE_ENABLED: "true"
          TURNSTILE_SECRET_KEY: turnstile_test_placeholder
          VITE_TURNSTILE_SITE_KEY: turnstile_site_test_placeholder
        run: |
          docker compose -f docker-compose.dokploy.yml config --quiet
          docker compose -f docker-compose.dokploy.yml config --format json | jq -e '.services | all(.networks | has("dokploy-network"))'
      - run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} --target migration --tag monqom-backend-migration:ci --file backend/Dockerfile .
      - run: docker run --rm --entrypoint sh monqom-backend-migration:ci -c 'test -f /app/backend/prisma.config.ts'
      - run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} --target runtime --tag monqom-backend:ci --file backend/Dockerfile .
      - run: docker run --rm --entrypoint sh monqom-backend:ci -c 'test -f /app/dist/main.js && grep -q "APP_VERSION=.ci." /app/release.env && grep -q "GIT_SHA=.${{ github.sha }}." /app/release.env'
      - run: docker build --build-arg APP_VERSION=ci --build-arg GIT_SHA=${{ github.sha }} --tag monqom-frontend:ci --file frontend/Dockerfile .
      - run: docker run --rm --add-host backend:127.0.0.1 monqom-frontend:ci nginx -t
      - run: docker run --rm --entrypoint sh monqom-frontend:ci -c 'grep -q "script-src .self. https://challenges.cloudflare.com" /etc/nginx/conf.d/default.conf && grep -q "frame-src https://challenges.cloudflare.com" /etc/nginx/conf.d/default.conf && grep -q "X-Forwarded-Proto .client_forwarded_proto" /etc/nginx/conf.d/default.conf && test -f /usr/share/nginx/html/theme-init.js && ! grep -q "<script>" /usr/share/nginx/html/index.html'
      - run: docker run --rm --entrypoint sh monqom-frontend:ci -c 'grep -q "\"version\":\"ci\"" /usr/share/nginx/html/version.json && grep -q "\"sha\":\"${{ github.sha }}\"" /usr/share/nginx/html/version.json'
