name: Deploy release to Dokploy
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to deploy
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - run: test "$(git describe --exact-match --tags HEAD)" = "${{ inputs.tag }}"
      - env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: >-
          test -n "$DOKPLOY_WEBHOOK_URL" &&
          curl --fail-with-body --retry 3 --retry-all-errors
          --connect-timeout 10 --max-time 30
          --request POST "$DOKPLOY_WEBHOOK_URL"
