name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published release tag
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          RELEASE_SHA: ${{ steps.semantic.outputs.new_release_git_head }}
        run: >-
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" &&
          test "$RELEASE_SHA" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - name: Verify production deployment
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_SHA: ${{ steps.semantic.outputs.new_release_git_head }}
        run: |
          test -n "$PRODUCTION_URL" || {
            echo "Set the public PRODUCTION_URL repository variable"
            exit 1
          }
          case "$PRODUCTION_URL" in
            https://*) ;;
            *) echo "PRODUCTION_URL must use HTTPS"; exit 1 ;;
          esac
          production_url="${PRODUCTION_URL%/}"
          for _attempt in $(seq 1 60); do
            deployed_sha="$(curl --fail --silent --show-error --max-time 10 \
              "$production_url/version.json" | jq -r '.sha // empty' || true)"
            if [ "$deployed_sha" = "$RELEASE_SHA" ] && \
              curl --fail --silent --show-error --max-time 10 \
                "$production_url/api/ready" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become ready on release $RELEASE_SHA"
          exit 1
