# Never log query strings or headers. Keep nginx to critical messages because its error logs
# can contain a complete failed request target. Application logs retain sanitized 5xx events.
map $uri $safe_log_uri {
  default $uri;
  ~*mqic[_%] "[redacted]";
}
log_format safe_requests '$remote_addr $request_method $safe_log_uri $status $body_bytes_sent $request_time';

map $http_cf_visitor $client_forwarded_proto {
  # Never trust a client-supplied X-Forwarded-Proto value. Cloudflare supplies
  # CF-Visitor for the original scheme; direct/internal requests use this hop's scheme.
  default $scheme;
  ~*"scheme"\s*:\s*"https" https;
  ~*"scheme"\s*:\s*"http" http;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /dev/stdout safe_requests;
  error_log /dev/stderr crit;

  # Docker assigns a new IP address when the backend container is recreated.
  # Resolve it at request time so a backend-only Dokploy redeploy does not leave
  # nginx proxying to the previous container address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $backend_upstream http://backend:3000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location = /version.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /api/health {
    proxy_pass $backend_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
  }
  location = /api/ready {
    proxy_pass $backend_upstream/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
  }
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_forwarded_proto;
  }
  location / { try_files $uri $uri/ /index.html; }
}
